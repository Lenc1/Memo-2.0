name: memo_program
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^0.8.5+3
  cupertino_icons: ^1.0.2
  flutter_heatmap_calendar: ^1.0.5
  provider: ^6.1.2
  flutter_markdown: ^0.6.13
  simple_heatmap_calendar: ^0.4.0
  table_calendar: ^3.0.9
  heatmap_calendar: ^1.0.1
  window_manager: ^0.3.7
  file_picker: ^5.0.1
  path_provider: ^2.0.11


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/avator.jpg
    - lib/assets/addition_fill.png
    - lib/assets/tag.png
    - lib/assets/pen.png
    - lib/assets/back.png
    - lib/assets/photos.png
    - lib/assets/backfile.png
  fonts:
    - family: SourceHanSans
      fonts:
        - asset: lib/assets/fonts/SourceHanSansSC-Regular-2.otf
        - asset: lib/assets/fonts/SourceHanSansSC-Bold-2.otf
          weight: 700


